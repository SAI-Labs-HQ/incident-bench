# Model aliases. Use an alias (--model gpt-6-luna) or a raw spec "<provider>:<model>" (--model openrouter:qwen/qwen3.8-flash).
# Every alias below runs through OpenRouter with one OPENROUTER_API_KEY. Add your own aliases freely.
# --- OpenRouter (targets, incident models, non-Azure fallbacks) ---
gpt-6-sol:          {provider: openrouter, model: openai/gpt-6-sol}
gpt-6-astra:        {provider: openrouter, model: openai/gpt-6-astra}
gpt-6-luna:         {provider: openrouter, model: openai/gpt-6-luna}
gpt-4o-mini:        {provider: openrouter, model: openai/gpt-4o-mini}
gpt-4o:             {provider: openrouter, model: openai/gpt-4o-2024-11-20}
gpt-4.1-mini:       {provider: openrouter, model: openai/gpt-4.1-mini}
claude-opus-5.5:    {provider: openrouter, model: anthropic/claude-opus-5.5}
claude-sonnet-5.5:  {provider: openrouter, model: anthropic/claude-sonnet-5.5}
claude-haiku-5.5:   {provider: openrouter, model: anthropic/claude-haiku-5.5}
gemini-2.5-flash:   {provider: openrouter, model: google/gemini-2.5-flash}
glm-5.3:            {provider: openrouter, model: z-ai/glm-5.3}
qwen3.8-flash:      {provider: openrouter, model: qwen/qwen3.8-flash}
qwen3.8-27b:        {provider: openrouter, model: qwen/qwen3.8-27b}
kimi-k3.1-pro:      {provider: openrouter, model: moonshotai/kimi-k3.1-pro}
llama-3.1-8b:       {provider: openrouter, model: meta-llama/llama-3.1-8b-instruct}
mock:               {provider: mock, model: model}
# --- Historical snapshots (incident replication). On OpenRouter these route only through Azure, which the global
# `provider.ignore: [Azure]` excludes; these aliases allow it (Azure's content filter may block some prompts:
# record such blocks as provider refusals). Found in the pilot build (chatgpt-sodium-bromide-250805), 2026-11-13.
gpt-3.5-turbo-0613: {provider: openrouter, model: openai/gpt-3.5-turbo-0613, model_args: {provider: {allow_fallbacks: true}}}
gpt-4o-2024-05-13:  {provider: openrouter, model: openai/gpt-4o-2024-05-13, model_args: {provider: {allow_fallbacks: true}}}
gpt-4o-2024-08-06:  {provider: openrouter, model: openai/gpt-4o-2024-08-06}
