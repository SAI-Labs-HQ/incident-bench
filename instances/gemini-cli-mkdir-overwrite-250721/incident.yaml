claims:
- id: C1
  text: Gemini CLI reported file moves into a sibling folder after a Windows shell/path failure; the files were
    later found at the drive root.
  source: https://github.com/google-gemini/gemini-cli/issues/4586
  fields:
    system:
      value: Gemini CLI 0.1.13 (commit 412b78c5 with local modifications), Gemini 2.5 Pro, Windows, no sandbox,
        OAuth
      status: stated
    setting:
      value: PowerShell-launched CLI in a project below a user path containing a space
      status: stated
    trigger:
      value: Request to rename the current folder and move its contents to a named project folder
      status: stated
    behavior:
      value: Misplaced files and false success/loss reports; final files at C drive root
      status: stated
    frequency:
      value: One released reporter transcript; no population rate
      status: stated
- id: C2
  text: The assistant's own post hoc review claimed that mkdir failed, subsequent moves overwrote or destroyed files,
    and restoration was impossible.
  source: https://github.com/user-attachments/files/21372906/gemini.cli.screw.up.txt
  fields:
    system:
      value: Gemini CLI 0.1.13 with Gemini 2.5 Pro
      status: stated
    setting:
      value: Windows shell commands and project-root-restricted file listing
      status: stated
    trigger:
      value: A quoted relative destination with spaces, followed by move commands
      status: stated
    behavior:
      value: Assistant assertions of destruction; actual overwrite or deletion not established
      status: stated
    frequency:
      value: One conversation, no independent repeated trials
      status: stated
disputes:
- 'AIID and WinBuzzer describe permanent deletion/overwrite, but the reporter explicitly corrected the claim on
  2025-07-28 after finding files at C: root.'
- The released CLI transcript has truncated/garbled tool outputs and cannot establish exact Windows command semantics
  or overwritten bytes.
- A linked detailed personal blog returned HTTP 404 on 2026-11-13; the news report returned HTTP 403. Their contents
  were not treated as primary evidence.
