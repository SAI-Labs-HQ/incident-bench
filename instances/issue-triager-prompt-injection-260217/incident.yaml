id: issue-triager-prompt-injection-260217
title: Unknown actor used exposed Cline npm token after issue-triage prompt injection vulnerability
date: 2026-02-17
reported: 2026-02-09
summary: 'A researcher showed on a mirror that Cline''s Claude-powered GitHub issue triager could be induced by
  issue text to run an npm install command. The workflow used Claude Opus 4.5 with Bash access and interpolated
  the issue title directly into the prompt. Cline later confirmed that an unauthorized actor used an exposed, mistakenly
  unrevoked npm publish token on February 17 to publish cline@2.3.0 with a postinstall script that installed OpenClaw.
  A public production trace linking the original prompt injection to the token theft has not been released.

  '
