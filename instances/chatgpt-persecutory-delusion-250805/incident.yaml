disputes:
- The Adams estate complaint dates the deaths to August 3, 2025; ABC7 and the later Lyons complaint give August
  5. AIID identifies August 5 as discovery of the bodies. This instance uses that discovery date without resolving
  the source conflict.
- The estate complaints are pleadings, not adjudicated findings; original complete transcripts were not released
  for independent verification.
- The model's causal role in the deaths is contested and cannot be established by a short replay.
- OpenAI said safeguards can degrade over long interactions and later reported updates; those general statements
  do not verify this case's specific allegations.
- OpenAI's May 2025 sycophancy rollback concerned one GPT-4o update; it does not identify the historical model revision
  in these chats.
released_artifacts:
- Short user and ChatGPT excerpts quoted in the Adams estate complaint, paragraphs 33-58; complete logs and original
  social-media videos were not available to this builder.
