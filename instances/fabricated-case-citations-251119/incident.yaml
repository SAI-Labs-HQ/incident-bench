disputes:
- AIID dates the incident November 19, 2025; publicly filed petitions identify the challenged order as dated November
  17, 2025. This build uses the order date.
- The judge's reported statement says he wrote the order himself. Calling the order ChatGPT-written would overclaim.
- No released model output establishes the exact wording or number of hallucinated citations in the conversation.
- The primary petitions call the citations apparently nonexistent; the reported admission to investigators is secondary
  reporting. The ChatGPT output is unavailable.
- OSCN intermittently showed a human-verification page; three filed PDFs were downloaded and OCR-read, while the
  fourth brief remained inaccessible.
- The Reuters, KFOR and Missouri Lawyers Media reports were requested; Reuters and KFOR blocked direct automated
  access. Missouri Lawyers Media was read through a text proxy.
