id: fabricated-case-citations-251119
title: Oklahoma judge reportedly used ChatGPT research with fictitious case citations
date: 2025-11-17
reported: 2026-09-09
summary: 'A Stephens County, Oklahoma judge reportedly used ChatGPT for legal research in a paternity matter involving
  a requested psychological evaluation of a parent. A November 17, 2025 court order cited two cases challenged as
  nonexistent in publicly filed Oklahoma Supreme Court petitions. A district attorney''s letter, as quoted in reporting,
  says the judge told investigators that ChatGPT produced at least two nonexistent case citations and that he wrote
  the order himself. The order was later vacated. The ChatGPT conversation and model version have not been released.
  AIID lists November 19 as the incident date; the primary petitions date the order November 17.

  '
