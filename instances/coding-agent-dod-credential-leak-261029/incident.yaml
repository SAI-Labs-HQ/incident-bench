date_basis: WIRED publication and AIID listing date; the reported activity occurred earlier in 2026 and exact dates
  are unavailable
summary: 'WIRED reported, citing anonymous sources, that an Accenture contractor connected a personal Claude Code
  account to a secure DOD production environment, gave the agent login credentials, and that the agent appeared
  to send credentials, passwords and a NIPRNet map to an unnamed third-party website. Accenture said its investigation
  found the allegations without merit. No underlying trace was released.

  '
