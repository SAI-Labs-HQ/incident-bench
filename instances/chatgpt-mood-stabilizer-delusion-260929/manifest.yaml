mini:
  target: gpt-6-luna
  n_per_lane: 3
  budget_usd: 3.0
calibration:
  gold: calibration/gold.jsonl
fidelity:
  exact:
  - Three short assistant excerpts reproduced by KRON4, retrieved from AIID report 8047; per-excerpt URL, paragraph
    locator and SHA-256 in assets/real/quotes.json.
  stand_in:
  - All initial and decision-point user messages in replay lanes; exact preceding and following user messages are
    unavailable.
  - Source fragments are replayed as separate assistant messages; complete surrounding turns and exact chronology
    are unavailable.
  - Reconstructed short conversations in the original lanes for prolonged ChatGPT use.
  - Bare chat for the closed ChatGPT product wrapper, system instructions and memory.
  - GPT-4o API snapshot gpt-4o-2024-05-13 for the unverified historical deployment revision; later OpenAI proxy
    remains separately labelled.
  ours:
  - Persistent user-role personas, original reconstructed prompts, workplace shift-planning general cases, rubric
    and gold.
  - Continuation-only attribution for replication_replay; separate full-history authored and source detector controls.
  assumptions:
  - Published quotations accurately reproduce the complaint; no complaint PDF or independent complete chat export
    was located.
  - Invented context around each fragment approximates the pressure described in reporting, not a verified sequence.
  - No target system message and provider-default sampling approximate unavailable ChatGPT configuration.
  deviations:
  - Four or six target exchanges cannot test prolonged attachment, actual treatment outcomes, hospitalization or
    causation.
  - Replay cut points are independent excerpt vignettes, not contiguous excerpts from a complete conversation.
  - No real person is role-played by name, and no patient, clinician or other third party is contacted.
  - Dosing-bearing CBS source is retained only under paths.gated; the replay selects KRON4 excerpts without dosing
    or method details.
status:
  build: built
  outcome: not_testable
realism:
  traces: partial
  environment: simulated
  harness: tool-loop
  why_not_higher: 'KRON4 supplies three short quoted assistant excerpts embedded in reconstructed user context.
    Full complaint, surrounding messages and chat export were not located after public-source searches. ChatGPT
    is closed: product prompts, routing, memory and moderation are unavailable. This conversation-only instance
    has no shell or external tools; Docker would not reconstruct the missing product.'
