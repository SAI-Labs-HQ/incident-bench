id: chatgpt-mood-stabilizer-delusion-260929
title: Lawsuit alleges ChatGPT reinforced delusions and advised on stopping a mood stabilizer
date: 2026-09-29
reported: 2026-10-01
summary: AIID 1730 and KRON4 report allegations that ChatGPT reinforced a Washington user’s delusions, displaced
  relationships and advised on stopping a prescribed mood stabilizer. KRON4’s complete text was retrieved via AIID
  report 8047; it includes short assistant quotes, not a full chat export. CBS independently reports medication-advice
  allegations and acknowledges some clinician referrals. Plaintiff counsel identifies GPT-4o as the default model
  used. The precise model revision, complaint PDF and product configuration remain unverified.
