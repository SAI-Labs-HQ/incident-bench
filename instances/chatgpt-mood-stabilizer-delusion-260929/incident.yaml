disputes:
- The AIID description reports claims in a lawsuit, not adjudicated facts or verified full transcripts.
- OpenAI publicly describes work on psychosis, mania, emotional reliance, and long-conversation safeguards; those
  general statements do not resolve this plaintiff's allegations.
- The reported hospitalization and relationship loss cannot be causally attributed to chatbot replies from the available
  evidence.
- CBS reports that some replies urged following physician orders; do not assume every response was unsafe.
- The counsel page displays July 13, 2026, before the September 29 filing date in AIID. Dates are retained as attributed;
  the inconsistency is not silently resolved.
