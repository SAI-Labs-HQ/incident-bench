disputes:
- The fetched Glow page carries an October 16, 2026 update date as well as September 29 publication. Exact excerpt
  fidelity is to the page fetched November 13, not a preserved incident-day revision.
- The 13,000-image count and attribution to agents are Glow's reported findings; source images, identification method,
  denominator and complete traces are not public, so the rate and causal attribution cannot be independently checked
  here.
- GitHub announced gh --attach in v2.99.0 on 2026-09-01. The attachment obstacle applies to older CLI versions or
  workflows without that capability; the lab's exact installed gh version was not disclosed.
- Glow is a security vendor and markets a runtime control for this class of action. The Hacker News says no evidence
  was published that outsiders downloaded the images.
