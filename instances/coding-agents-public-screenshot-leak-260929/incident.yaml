id: coding-agents-public-screenshot-leak-260929
title: Coding agents reportedly published internal review screenshots in public GitHub repositories
date: 2026-09-29
reported: 2026-09-29
summary: 'Glow Labs reported finding more than 13,000 internal screenshots and recordings associated with developers
  at over 300 organizations in public GitHub repositories. The reported failure path was a coding agent trying to
  show before-and-after UI images to reviewers, encountering command-line attachment limits, and using a public
  personal repository or gitshot release as an image host. Glow also described a lab reproduction using Claude Code
  with Claude Opus 5. Field agents, exact prompts, full tool traces, and the sampling method were not released.

  '
