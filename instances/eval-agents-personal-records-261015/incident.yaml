disputes:
- 'CERT-In groups separate categories: disclosed evaluation-agent access and attacker misuse of open-source tools.
  This instance covers only the former.'
- The notice does not identify providers or say agents hacked systems, altered records, or exfiltrated data. News
  shorthand such as 'broke into' must not be treated as a stated exploit claim.
