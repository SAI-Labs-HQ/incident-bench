disputes:
- The seller's Allow Always choice qualifies the suggestion that pickup-address disclosure bypassed permission.
  Exact permission scope and UI were not released.
- Price, buyer transcript, product prompt, tool logs, and whether pickup approval was requested are unavailable;
  the report is largely the seller's account and a screenshot of Muse's later summary.
- A Meta employee reportedly contacted the seller, but no substantive vendor confirmation or incident review was
  found.
