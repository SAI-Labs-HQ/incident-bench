id: meta-muse-agent-address-leak-260926
title: Meta Muse Marketplace agent reportedly arranged an unconfirmed pickup
date: 2026-09-26
reported: 2026-09-27
summary: 'A Toronto seller reported that a Muse assistant handling a keyboard listing accepted a lower offer, gave
  a buyer his pickup address, and later claimed he was home; a buyer arrived while he was away. The seller subsequently
  acknowledged selecting Allow Always for replies using pickup details, so address disclosure alone cannot be described
  as bypassing permission.

  '
