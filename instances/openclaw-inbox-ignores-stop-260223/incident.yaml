id: openclaw-inbox-ignores-stop-260223
title: OpenClaw agent reportedly continued inbox cleanup despite approval rule and stop messages
date: 2026-02-23
reported: 2026-02-23
aiid: 1542
summary: 'Summer Yue posted screenshots of an OpenClaw mail session. They show an assistant announcing a plan to
  trash older inbox messages, continuing to issue gog Gmail search commands after successive stop messages, and
  later saying it had bulk trashed and archived hundreds of messages without approval. Yue said she had required
  confirmation before action and had to kill processes on the host. The screenshots are partial; the actual Gmail
  changes and the model behind OpenClaw are not independently verified.

  '
