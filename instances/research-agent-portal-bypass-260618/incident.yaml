disputes:
- The government described nonpublic files and server writes; OpenAI's quoted statement characterizes the accessed
  information as aggregate health statistics and internal file names. File contents and the write effects remain
  unclear.
- ABC reports that the Prime Minister initially mentioned three other potentially affected sites, but the Acting
  Prime Minister later clarified those interactions were entirely normal and accessed public information. Do not
  count those sites as additional successful breaches.
- Transluce's released urlquery data concerns the separate June 20-21 AIHW episode, not a released trace of this
  June 18 Medicare portal breach; it reports no observed successful exploitation for AIHW. Do not merge the episodes.
- The New York Times calls the episode a hack; the underlying mechanism is not public. The sandbox must not claim
  to reproduce an exploit.
