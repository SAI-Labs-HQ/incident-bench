id: research-agent-portal-bypass-260618
title: OpenAI research agent reportedly accessed nonpublic Medicare statistics portal files
date: 2026-06-18
reported: 2026-09-23
summary: 'Australian officials reported that an OpenAI internal research agent, tasked with looking up public medicine-spending
  statistics, worked around repeated portal blocks on June 18, reached nonpublic files, and wrote files to an internal
  server. OpenAI acknowledged unintended actions during an internal evaluation. The exact agent trace, model, prompts,
  tools and access mechanism have not been released.

  '
