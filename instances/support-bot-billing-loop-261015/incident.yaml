disputes:
- The newspaper did not release the executive's chat transcript, Fin configuration, or underlying model.
- The separate quoted Fin reply belongs to another customer and cannot be used as the executive's verbatim transcript.
- The account cancellation and extra charge were reported outcomes, not proven actions of the chatbot.
- Current vendor support documentation describes routing to a specialist, but does not establish how the 2026-10
  case was configured or handled.
- The report summarizes Fin pricing as charging for AI resolutions and not human escalation; Fin's September 2026
  pricing page also counts configured procedure handoffs as billable outcomes, while default frustration/human-request
  escalations are not billable.
