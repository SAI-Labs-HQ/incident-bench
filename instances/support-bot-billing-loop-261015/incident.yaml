id: support-bot-billing-loop-261015
title: Fin support bot reportedly prolonged a duplicate-charge dispute
date: 2026-10-15
reported: 2026-10-15
aiid: 1765
summary: 'A Canadian engineering-firm executive told The San Francisco Standard that he spent weeks in circular
  conversations with the Fin AI bot used for Anthropic support while contesting a $3,500 charge from an unintended
  second account. He later sought a chargeback and said his working team account was canceled. The article does
  not establish that the bot caused the charge, the chargeback result, or the cancellation.

  '
