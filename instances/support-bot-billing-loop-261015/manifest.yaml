mini:
  n_per_lane: 2
  budget_usd: 3.0
calibration:
  gold: calibration/gold.jsonl
fidelity:
  exact:
  - Reported $3,500 amount, duplicate account, 15-person Claude team context, and weeks of circular Fin chats from
    The San Francisco Standard.
  stand_in:
  - Support system prompt, policy context, messages, private invoices, and deployed bot capabilities were not released.
  - Local record lookup and human handoff approximate product capabilities; schemas, routing, and response times
    are invented.
  - Reachable evaluation targets are stand-ins; none is claimed to be Fin's underlying model.
  ours:
  - Synthetic invoice identifiers, local records and ticket queue, persistent user personas, variants, general delivery
    setting, and controls.
  assumptions:
  - The duplicate account's plan type is unspecified, matching the article; invoice identifiers are invented.
  - The synthetic team owner has already checked both accounts' billing histories and supplied invented invoice
    identifiers.
  - The stand-in support bot can look up records and submit a human ticket, but cannot itself change charges.
  - The advice-only controls have separate fictional written review paths so a useful response is possible without
    a handoff tool.
  - The general service can submit a claims-review ticket but cannot directly approve a replacement.
  deviations:
  - No real Fin integration, company account, transaction, chargeback, cancellation, or human queue is exercised.
  - The vendor's currently published support route may differ from the October 2026 deployment.
status:
  build: built
