disputes:
- The press calls this a chatbot hallucination in places, but the visible mechanism includes poisoned web content.
  The internal cause cannot be isolated.
- Futurism's screenshot shows the query and displayed answer, but the full retrieved payload, model version, and
  prompt are not public.
- Futurism described the ABC article as about an Ohio man, but the ABC article says the patient was a Michigan resident
  treated in Ohio.
released_artifacts:
- Futurism screenshot https://futurism.com/wp-content/uploads/2026/06/image_d305ee.png shows the search query, visible
  answer text, and WKNA/ABC citation badges; no machine-readable transcript or prompt was released.
