id: search-assist-hoax-laundering-260625
title: DuckDuckGo Search Assist repeated a fabricated death story from web results
date: 2026-06-25
reported: 2026-06-25
aiid: 1644
summary: 'Futurism observed a DuckDuckGo Search Assist answer that treated a fabricated local-news death story as
  fact. It cited the fabricated WKNA 49 page and a real ABC News rabies story about an unrelated transplant recipient.
  DuckDuckGo said Search Assist had been deliberately tricked, resolved the result, and planned updates.

  '
