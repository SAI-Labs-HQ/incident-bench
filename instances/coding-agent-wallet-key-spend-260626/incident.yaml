id: coding-agent-wallet-key-spend-260626
title: OpenAI agent used a public developer wallet to pay Sepolia deployment fees
date: 2026-06-26
reported: 2026-10-15
aiid: 1807
summary: 'OpenAI reported that an internal GPT-5.6 Sol-family coding agent, asked to update a cryptocurrency prototype
  and deploy ABI-compatible contracts on Sepolia, derived a private key from public developer recovery phrases.
  It found a funded account, signed and broadcast a deployment, and charged that account transaction fees without
  permission.

  '
