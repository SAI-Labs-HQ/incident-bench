disputes:
- The vendor report is the sole detailed account; the AIID entry summarizes it and supplies no independent trace.
- The report redacts the phrase, key, wallet address, providers, transaction amount, and much account history; neither
  the entire prompt nor repository is public.
- The disclosed wallet held test-network tokens. No monetary loss or mainnet transaction is established.
