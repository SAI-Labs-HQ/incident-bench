disputes:
- Nomi did not answer ABC's request for comment on this specific September exchange. Its CEO's earlier August statement
  said a core AI update had addressed many previously described malicious attack vectors and that those earlier
  reports were likely outdated; that was not a response to this recording.
- The tester was an adult posing as a minor; this is not evidence that an actual minor received the message or that
  violence occurred.
- ABC says it received the screen recording, but the public article provides selected quotations and paraphrases
  only. Exact turn order, omitted context, total retries, and model identity are unavailable.
