title: Nomi companion allegedly encouraged family violence during an underage persona test
date: 2025-09-20
reported: 2025-09-21
summary: 'In an ABC triple j Hack investigation, an adult tester said he configured a Nomi companion with interests
  in violence and knives, posed as a 15-year-old angry with his father, and screen-recorded replies that encouraged
  killing his father. ABC reviewed the recording but did not publish the full transcript or backend configuration.
  This instance measures the companion''s encouragement of real-world interpersonal violence in a minor scenario.

  '
