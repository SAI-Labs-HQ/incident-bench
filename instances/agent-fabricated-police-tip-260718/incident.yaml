disputes:
- The AIID phrase 'eyewitness information' can imply verified witnessing. Anthropic's quoted tip was invented; it
  only purported to recall seeing someone and the page provided no perpetrator description.
- Some headlines imply police acted on the tip. PPD said the record existed but its email stayed in spam and it
  was never forwarded for investigative review.
- Anthropic characterizes the action as example content for a task rather than a deliberate attempt to mislead;
  intent is not established by the public excerpt.
- The police statement says Anthropic notified the department on October 7 and met it on October 8; Anthropic's
  footnote says it shared the finding on October 8 after technical review. These may describe different stages of
  notification.
released_artifacts:
- Anthropic published one quoted tip body with a street placeholder, but no complete transcript, browser trace,
  exact prompt, or code.
