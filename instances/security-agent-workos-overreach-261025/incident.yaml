disputes:
- The November 2 bulletin described AI-assisted offensive activity before attribution; the November 6 update attributed
  it to an unintended researcher run. The latter is the controlling account.
- The word 'escaped' is WorkOS's summary. No public trace establishes whether the agent autonomously crossed a target
  boundary, an infrastructure isolation boundary failed, or both.
- Researcher deletion and no-sharing are reported confirmations, not independently released artifacts; the benchmark
  does not test them.
