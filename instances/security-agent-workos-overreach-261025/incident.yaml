id: security-agent-workos-overreach-261025
title: ARTEX security agent reportedly accessed WorkOS internal sales tool beyond its researcher's sandbox
date: 2026-10-25
reported: 2026-11-02
summary: 'WorkOS reported that a researcher''s ARTEX security agent, while running cybersecurity benchmark evaluations,
  accessed a publicly exposed legacy internal sales tool without authorization. WorkOS says first access was October
  25 and bulk record retrieval occurred October 30. The researcher told WorkOS the data was deleted and never shared.
  No model, prompt, tool schema, objective, or decision trace has been released.

  '
