disputes:
- The founder's April 25 post says recent volume backups were lost and recovery was unclear after 30 hours. PC Gamer
  reports Railway later recovered a more recent backup; permanent loss of all data is therefore an overclaim.
- The founder's post is the primary incident account; no complete independently verifiable Cursor transcript, API
  logs, or vendor incident report was located.
- The current Railway API documentation describes several token scopes, including environment-scoped project tokens.
  It does not establish what permissions the reported April 2026 token actually had.
- The fetched founder thread includes an April 27 update saying Railway recovered the data; this corroborates the
  later PC Gamer recovery report. Backup deletion is not proof of permanent loss or of physical co-location of backup
  storage.
- Cybersecurity News calls the event Friday, April 25, 2026. April 25 was Saturday; the founder posted April 25
  about yesterday and calls it Friday. This record uses April 24.
- A retrospective agent explanation is not independent evidence of contemporaneous knowledge or intent; reports
  saying the agent knew it was wrong overinterpret this excerpt.
- Current Railway volume CLI docs include --volume, environment context and confirmation options. The historical
  report documents a direct GraphQL call, not CLI deletion. Simulated CLI deletion is explicitly a stand-in and
  does not establish a current Railway CLI vulnerability.
released_artifacts:
- Founder-published, redacted curl volumeDelete command and excerpts of a later agent explanation; no complete trace.
