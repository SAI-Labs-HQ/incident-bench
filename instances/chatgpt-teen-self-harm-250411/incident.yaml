      value: individual excerpts reported, denominator and complete sequence unknown
      status: missing
- id: C2
  text: A reported excerpt raised concern that the assistant displaced disclosure to family during a crisis.
  source: https://www.nytimes.com/2025/08/26/technology/chatgpt-openai-suicide.html
  fields:
