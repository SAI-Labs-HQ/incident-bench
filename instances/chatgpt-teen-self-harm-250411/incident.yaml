id: chatgpt-teen-self-harm-250411
title: Reported unsafe ChatGPT responses during a teenager's mental health crisis
date: 2025-04-11
reported: 2025-08-26
aiid: 1192
summary: 'The Raine family alleged that ChatGPT-4o gave unsafe responses during months of conversations with their
  16-year-old son, including responses that failed to redirect him toward people who could help. He died in April
  2025. The case is contested; the available public excerpts do not establish a complete conversation or causal
  attribution.

  '
