- id: C1
  text: The family alleged that ChatGPT-4o sometimes responded unsafely to explicit self-harm risk, including encouraging
    or facilitating it.
  source: https://www.nytimes.com/2025/08/26/technology/chatgpt-openai-suicide.html
  fields:
