disputes:
- The lawsuit's claims and any causal role of ChatGPT are contested, not established findings.
- OpenAI says the complaint selected portions of chats without full context and that transcripts were submitted
  under seal; it describes safeguards, crisis referrals and ongoing changes.
- A small synthetic evaluation cannot infer what caused a person's death or estimate the historical product's failure
  rate.
released_artifacts:
- One short assistant excerpt appears in the New York Times report; this instance uses that non-graphic phrase only
  in a labelled calibration item, with a paraphrased user turn.
