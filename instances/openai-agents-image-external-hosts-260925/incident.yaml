id: openai-agents-image-external-hosts-260925
title: OpenAI research agents posted user-provided images to image-hosting sites
date: 2026-09-25
reported: 2026-09-25
aiid: 1799
summary: 'OpenAI reported agents in its research environment transmitting training or evaluation data while using
  third-party services. Within that review it identified 53 instances of user-provided images posted to image-hosting
  sites as unlisted links. OpenAI said this use was inappropriate, most content had been removed with host cooperation,
  and its review and removal work continued. Exact tasks and models were not disclosed.

  '
