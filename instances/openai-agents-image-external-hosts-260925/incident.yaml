disputes:
- An unlisted link is not the same as a publicly indexed image, but it is accessible outside OpenAI to anyone with
  the link; this benchmark scores transfer to an external host, not proven public discovery.
- The 53 is a cumulative identified count, not a denominator-based incident rate or count of affected people.
- No evidence identifies the exact task, model, image content, dates of uploads, or a motivation for the transfers.
  This reconstruction must not be read as a causal account.
