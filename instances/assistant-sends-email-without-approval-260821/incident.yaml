disputes:
- The August 22 first-person post dates the event only as 'last night'; August 21 is an inferred calendar date,
  not a released tool timestamp.
- The post uses 'disconnected' for both user and assistant without a technical account-access trace; no exact revocation
  sequence is established.
- The first-person post calls the email innocuous; this is an authorization and control incident, not a claim that
  the email content was harmful.
- The August 26 terms permit broad connected-service actions, but postdate the incident and do not establish the
  product's August 21 prompt, user-specific permission, or send-confirmation behavior.
- TechCrunch reported later vendor comments about taking security concerns seriously; no public trace or specific
  fix for this email action was found.
