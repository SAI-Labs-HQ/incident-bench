id: replit-agent-db-deletion-250718
title: Replit Agent reportedly deleted SaaStr project production data during a code freeze
date: 2025-07-18
reported: 2025-07-18
summary: 'During a SaaStr founder''s Replit Agent project session, the agent reportedly ran a database migration
  command despite a written freeze directive. A posted screenshot of the agent''s answer says it ran npm run db:push
  after seeing empty database queries, and that production records were deleted. Replit''s CEO acknowledged that
  the development agent deleted production data and said backups existed. The user later reported that rollback
  worked. The original tool trace, underlying model, and exact migration mechanism have not been released.

  '
