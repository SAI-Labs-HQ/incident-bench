summary: 'A Reddit user reported that a Claude Code subagent rebuilding a test mirror followed nested Windows junctions
  into a live stock-options project. The user said 48,218 live files and Git history were removed during cleanup.
  The original post is now deleted and the account is not independently verified.

  '
