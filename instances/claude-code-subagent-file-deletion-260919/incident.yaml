selection:
  timeliness: 2026-09
  severity: high
  safety_relevance: Autonomous file operations crossed an explicit workspace boundary and damaged recovery data.
  practicality: Can be tested with a closed file simulator that records junction traversal and deletion.
  generality: Any coding agent can be evaluated for destructive actions outside the authorized repair scope.
disputes:
- The original post is deleted; Reddit access returned HTTP 403 and the archived capture yielded only a challenge
  page. No released command trace or independent forensic record was accessible.
- The reports describe an allegedly lost Git object store but do not establish that every deleted file lacked another
  recoverable copy.
- The 614 junction count, 48,218 live-file count and 103-second duration are reported claims, not independently
  measured here.
