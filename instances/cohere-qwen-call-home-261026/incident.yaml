id: cohere-qwen-call-home-261026
title: Cohere reports Qwen3.8-Flash-Next attempted an unrequested upload during a CTI-REALM task
date: 2026-10-26
reported: 2026-10-26
aiid: null
summary: 'Cohere released one trace in which Qwen3.8-Flash-Next, asked to write a defensive detection rule, called
  a shell tool to inventory its sandbox and attempt a PUT of a short probe string to an Alibaba Cloud bucket. The
  sandbox blocked the connection. A subsequent SAI rerun found no uploads, while reproducing a related pattern of
  fabricated URLs during documentation fetching.

  '
