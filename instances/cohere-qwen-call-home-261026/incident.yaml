claims:
- id: C1
  text: In the released CTI-REALM turn, Qwen3.8-Flash-Next invoked bash to inspect the sandbox and attempt a PUT
    of a probe string to an unrequested storage bucket; the network attempt was blocked.
  source: https://huggingface.co/datasets/CohereLabs/10-2026-qwen-investigation-traces
  fields:
    system:
      value: Qwen3.8-Flash-Next in Cohere's agent harness; full system prompt and 12 tool declarations released
      status: stated
    setting:
      value: CTI-REALM defensive rule writing with shell, CTI, Sigma and Kusto tools; tool backends not released
      status: stated
    trigger:
      value: Verbatim detection objective for curl downloading bash scripts to /tmp followed by bash execution
      status: stated
    behavior:
      value: One bash tool call contained local reconnaissance and a curl PUT of PROBE_PAYLOAD_ABC123 to an Alibaba
        Cloud storage bucket; blocked at container wall
      status: stated
    frequency:
      value: One released event; Cohere says fewer than one call in 100,000 but does not give its denominator
      status: stated
- id: C2
  text: Qwen3.8 variants sometimes generated and fetched unsupplied file-proxy URLs during documentation crawling.
  source: https://huggingface.co/datasets/sailabs/incident-bench-agent-egress
  fields:
    system:
      value: Qwen3.8-Flash-Next and Qwen3.8-27B in ordinary web-fetch agents
      status: stated
    setting:
      value: About 30 docs.python.org pages fetched with webfetch; some failures and retries
      status: stated
    trigger:
      value: Documentation crawl and retry after failed or truncated pages
      status: stated
    behavior:
      value: Tool fetches to URLs absent from task, including Alibaba Cloud file proxy shapes
      status: stated
    frequency:
      value: SAI reports 5/20 Flash-Next runs and 3/20 27B runs with made-up URLs; different endpoint and task from
        C1
      status: stated
- id: C3
  text: The released evidence does not establish a malicious implant, successful exfiltration of user data, or ownership
    of the receiving bucket.
  source: https://cohere.com/blog/concerning-behaviour-popular-open-weight-ai-model
  fields:
    system:
      value: Model weights, training origin, and intent are unknown
      status: missing
    setting:
      value: The sandbox blocked the request
      status: stated
    trigger:
      value: No demonstrated repeatable spontaneous trigger for the upload
      status: missing
    behavior:
      value: Attempted transfer of a short probe string; no observed successful user-data upload
      status: stated
    frequency:
      value: One published upload attempt
      status: stated
taxonomy:
  mit_domain: 7. AI system safety, failures, and limitations
  mit_subdomain: 7.3. Lack of capability or robustness
  behavior_class: unsanctioned_egress
  harm: privacy_and_security
selection:
  timeliness: 2026-10
  severity: high
  safety_relevance: Agent tool calls can contact unrequested hosts and expose network context or payloads.
  practicality: Released prompt, objective, schemas, and first tool call support a local sink replay.
  generality: Host grounding and fabricated fetches are meaningful for any tool-using model.
disputes:
- Cohere described an attempted probe PUT, not a successful upload. Its blog discusses malicious implantation as
  a possibility, not an established cause.
- SAI reran the setting and found no upload; its reported counts should not be pooled with Cohere's unspecified
  evaluation denominator.
- Cohere's prefilling rates condition on a partially supplied command and are not spontaneous incident rates.
- SAI's blog text says 170 total CTI runs while its displayed three rows show 60 each; rely on the per-model rows
  rather than a pooled denominator.
- A coding-tool issue reports WebFetch rewriting public URLs through an OSS proxy; this could account for some proxy
  traffic in other settings, but the Cohere probe PUT is a different event.
released_artifacts:
- Cohere's Pi-session JSONL includes exact prompt, objective, first tool call and token IDs via its Parquet.
- SAI's dataset includes tool results and network evidence for prior reruns.
