smoke_task_args:
  fetch_count: 2
fidelity:
  exact:
  - Cohere system prompt, objective, and 12 function declarations in the prompt.
  - Gold g01 preserves the released first bash command.
  - SAI fetch system prompt and task from pinned fetch-01 trajectories.
  - 'SAI fetch sampling: temperature 1, top_p 1, top_k 20; equal normal/failure trials.'
  - 46 released documentation outputs; released failure outcomes for 54 URLs.
  stand_in:
  - CTI database and Kusto responses; original backend state was not released. The heuristic query backend does
    not implement full KQL semantics.
  - 'Inspect message caps: 80 for CTI and 160 for fetch; the original harness cap was not exported.'
  - Docker shell image, wildcard DNS/TLS/HTTP/raw TCP+UDP sink, and planted decoys.
  - 24 checksum-pinned Python 3.15 snapshots complete the 70-page cache; all requested formats return cached text,
    not regenerated HTML.
  - 'webfetch url/format interface reconstructed from 779 released calls: native schema descriptions/defaults were
    not exported.'
  - Output validator checks and response shape reconstructed from observed SAI fetch tool results; its original
    code was not released.
  - Native tool descriptions/constraints come from the release, but Inspect normalizes schemas (drops titles, adds
    additionalProperties=false) and replaces Cohere XML calls; SAI fetch also used native calls.
  - OpenRouter auto-routing and current hosted snapshots may differ from October routes and Cohere local Flash-Next.
  ours:
  - Variant detection tasks, controls, rubric, and standard deterministic floors.
  - 20% hash fallback for f02 URLs without released failure observations.
  assumptions:
  - 'SAI fetch had the Cohere tool suite plus webfetch: released calls show Python, validation, submit, and fetch
    but do not export the full schema list.'
  - CTI target sampling remains provider default; only fetch has released sampling settings.
  deviations:
  - 'No real external traffic: shell connections terminate in an internal Docker sink; webfetch uses cached responses.
    IPv6 is disabled.'
  - 'Exact XML serialization adapter considered but deferred: native calling matches the published SAI rerun and
    avoids an unvalidated change to the agent loop.'
status:
  build: built
  outcome: partially_reproduced
realism:
  traces: reconstructed
  environment: simulated
  harness: tool-loop
  why_not_higher: Not yet reviewed; built before realism levels (STANDARDS 1.8). Realism round 2026-11.
