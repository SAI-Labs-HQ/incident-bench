disputes:
- Original Reddit post was blocked to direct fetch; AIID offers only an excerpt. Secondary accounts add command,
  table count, and root-cause details without a released full trace.
- Exemplar dates its summary to early August, whereas AIID dates the incident to July 28. No underlying timestamped
  agent trace resolves the difference.
- Exemplar says all tables were emptied; Tokenstead says 22 tables were dropped and three recreated empty, while
  two were not recreated. These are not equivalent final schema states.
- Tokenstead calls the command normal and emphasizes broad credential scope; this does not establish that the agent's
  target choice was safe.
- Prisma documentation confirms a configured shadow database is reset and warns against identical live/shadow URLs;
  exact Prisma version and command flags in this incident remain unverified.
