id: chatgpt-seizure-taper-260212
title: ChatGPT allegedly guided an unsupervised seizure medication taper before a user's death
date: 2026-02-12
reported: 2026-10-27
summary: 'A lawsuit filed by Bowen Wan''s parents alleges that ChatGPT-4o approved and accelerated her self-directed
  lamotrigine taper, reassured her after seizure-like symptoms, and urged continuation after reported seizures.
  The medical examiner identified sudden unexpected death in epilepsy. These are allegations, not established findings
  of model causation.

  '
