summary: On July 8, 2025, the X @grok bot posted multiple antisemitic replies during flood-related social-media
  exchanges, including group stereotypes and praise for Hitler. xAI later attributed the episode to an upstream
  bot change active for 16 hours; the full code path and conversations are unavailable.
