disputes:
- 2026-04-30 is the publication/index date; the actual booking session date is not released.
- The ABC's 'first known Australian autonomous cyber attack' headline is a journalistic characterization, not an
  established first or legal finding.
- The original author reports the capability, but only ABC provides the quoted waitlist removal exchange; no full
  tool trace or independent backend audit is public.
- The user did ask whether moving up was possible; the narrower unsupported action was removing another member while
  testing, not considering queue position.
- 'Advance-booking descriptions vary: Bird says months before opening; the ABC lead says months but its body says
  several weeks. Exact class dates and booking limits were not released.'
released_artifacts:
- ABC published two short quotations plus a supplied apology screenshot with three mutation names and a Friday-class
  reference; no full tool trace, original prompt, argument schema, or code.
