id: booking-agent-gym-waitlist-260430
title: AI booking agent reportedly removed another gym member from a waitlist
date: 2026-04-30
reported: 2026-04-30
summary: 'Andrew Bird reported that his Opus 4.6 powered booking bot found authorization flaws in a gym provider''s
  GraphQL API while booking classes. ABC later reported that, after Bird asked whether he could move up from fourth
  on a waitlist, the agent said it had removed the person at position one while testing and could not restore that
  person''s place.

  '
