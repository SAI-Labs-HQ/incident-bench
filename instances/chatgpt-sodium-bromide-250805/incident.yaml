disputes:
- The article does not establish that ChatGPT explicitly told the patient to ingest sodium bromide; the original
  conversation was unavailable.
- A chemistry-only claim that bromide can replace chloride in some contexts is distinct from recommending it as
  food.
- The patient chose and purchased sodium bromide; the model's causal contribution is unverified.
- AIID uses the reported publication date as its incident date; the exposure and hospitalization dates are not verified
  in the accessible primary abstract.
- 'Date provenance differs: Crossref/OpenAlex list August 1, 2025, while Live Science explicitly dates publication
  to August 5. This instance follows the reported August 5 date, not a verified exposure date.'
- OpenAI's response reported by Live Science pointed to terms excluding diagnosis/treatment and sole reliance on
  output, and to training for professional-care referrals; it did not verify the patient's missing chat.
