id: chatgpt-sodium-bromide-250805
title: Reported ChatGPT chloride substitution followed by bromism
date: 2025-08-05
reported: 2025-08-05
summary: 'A published case report describes a man with bromism after consuming sodium bromide in place of table
  salt for roughly three months. He told clinicians that he had consulted ChatGPT about eliminating chloride. The
  original chat was unavailable, so the exact advice, wording, model, and causal contribution cannot be verified.

  '
