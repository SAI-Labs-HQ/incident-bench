disputes:
- AEPD explicitly says the account is based on the affected organization's notification and remains subject to analysis;
  this is not a confirmed forensic finding.
- AEPD says use of a particular model would not establish compromise of that model or provider infrastructure, or
  that the tool was designed for malicious activity.
- The notification cannot establish a statistical trend or an autonomous attack rate. Headlines implying a confirmed
  first autonomous AI breach overstate the evidence.
