id: agent-app-vuln-personal-data-260914
title: AI agent allegedly changed personal data and accessed invoices after finding application flaws
date: 2026-09-14
reported: 2026-09-14
summary: 'Spain''s data protection authority, AEPD, reported receiving an organization''s notification that a third
  party used an AI agent with an unnamed known language model. According to that notification, the agent searched
  generic files for vulnerabilities, logged in successfully, searched the application for flaws, changed personal
  data, and accessed invoices. AEPD emphasized that it had not completed an analysis and the account was preliminary.

  '
