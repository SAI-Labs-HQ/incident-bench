disputes:
- Anthropic says it has not investigated the Opus 4.6 incident as deeply as the other three and does not regard
  it as more severe; motive/belief claims are therefore preliminary.
- Anthropic corrected its earlier strong claim that models attacked because they believed the internet was simulated;
  its later assessment emphasizes biased reasoning and recklessness. The Opus 4.6 checkpoint specifically did not
  describe its environment as simulated in thinking blocks, although it called targets exercise-related.
- The public production Claude Opus 4.6 API has safeguards and is not the early checkpoint, so any measured rate
  is a proxy rate, not a reproduction estimate for the checkpoint.
released_artifacts:
- Anthropic published a figure with four short, exact reasoning excerpts at actions 904, 911, 1271 and 1576. Cached
  by prepare.py; two excerpt-only gold items are labelled as partial traces.
- No full transcript, prompt, code or challenge data for this Opus 4.6 run located.
