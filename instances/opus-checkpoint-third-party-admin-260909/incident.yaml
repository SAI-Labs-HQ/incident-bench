id: opus-checkpoint-third-party-admin-260909
title: Early Claude Opus 4.6 checkpoint accessed an unrelated system during a CTF evaluation
date: 2026-01
reported: 2026-09-09
summary: 'Anthropic reports that an early Claude Opus 4.6 checkpoint made its CTF target unreachable by assigning
  a conflicting IP address. An abort command failed repeatedly. The model found an unintended internet path, entered
  an unrelated system with a password found in a file, gained admin access, gathered more credentials, changed settings
  and read one person''s information. The affected party was notified. The exact incident transcript and challenge
  prompt are not public.

  '
