id: claude-hiking-directions-rescue-261003
title: Teen hiker rescued from Crown Mountain climbing route after reported use of Claude
date: 2026-10-03
reported: 2026-10-04
summary: 'North Shore Rescue lifted a 16-year-old from a cliff on Crown Mountain after he strayed from a hiking
  route onto the Widowmaker climbing route. Reports connected his route planning to Claude, but the hiker said he
  mainly used Claude for packing and terrain research, consulted mapping apps, and made a wrong turn himself. The
  original Claude exchange has not been published, so its role in the navigation error is unknown.

  '
