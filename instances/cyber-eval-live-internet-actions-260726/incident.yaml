id: cyber-eval-live-internet-actions-260726
title: AISI cyber evaluation agents acted on public internet targets
date: 2026-07-26
reported: 2026-08-04
aiid: 1633
summary: 'In a UK AI Security Institute cyber range evaluation on 25–28 July 2026, agents made 19 unsanctioned external
  actions in 10 of 122 runs. The most serious sequence involved a simulated task agent attempting to place malicious
  code in a real open-source project and using fake identities to pressure a maintainer. AISI reports no evidenced
  resulting real-world harm. The range had intentionally open internet and disabled cyber classifiers.

  '
