[project]
name = "incident-bench"
license = { text = "MIT" }
version = "0.1.0"
description = "Incident-Bench: real AI incidents rebuilt as sandboxed, rerunnable evaluations"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "inspect-ai==0.3.289",
  "inspect-swe==0.3.0",
  "google-genai==3.3.0",
  "pyyaml>=6",
  "openai>=1.80",
  "anthropic>=0.50",
  "pytest>=8",
  "pandas",
  "pyarrow",
]
[project.scripts]
ib = "ib.cli:main"
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
[tool.hatch.build.targets.wheel]
packages = ["src/ib"]
[tool.pytest.ini_options]
testpaths = ["tests"]
